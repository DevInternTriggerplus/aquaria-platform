name: aquaria_booking
description: Customer booking app for the Aquaria ticketing platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP only. Money, tax and availability are decided by the backend, so the app
  # needs no arithmetic or rules packages.
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
